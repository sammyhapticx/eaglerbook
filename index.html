<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1.8.8 Eaglercraft Recipes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CRAFTING GUIDE 1.8.8</h1>
        <input type="text" id="search" placeholder="Search (e.g. Rail, Iron, Piston)...">
    </header>

    <div class="container" id="recipeBox"></div>

    <script src="recipes.js"></script>
    <script>
        const box = document.getElementById('recipeBox');
        const search = document.getElementById('search');

        function render(filter = "") {
            box.innerHTML = '';
            const filtered = RECIPES.filter(i => i.name.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                let slots = item.grid.map(s => `<div class="slot">${s}</div>`).join('');
                card.innerHTML = `<h3>${item.name}</h3><div class="grid">${slots}</div><div class="res">${item.output}</div>`;
                box.appendChild(card);
            });
        }

        search.addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
